services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buchhaltung-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buchhaltung-backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    restart: unless-stopped

 